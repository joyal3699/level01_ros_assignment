amcl:
  ros__parameters:
    use_sim_time: true

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map

    scan_topic: /scan

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99

    update_min_d: 0.2
    update_min_a: 0.2

    laser_min_range: 0.1
    laser_max_range: 30.0
    laser_max_beams: 60

    tf_broadcast: true
    transform_tolerance: 1.0

    resample_interval: 1

    set_initial_pose: true

    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_a: 0.0
